<h2 mat-dialog-title>{{ data.title || 'Confirm' }}</h2>
<mat-dialog-content>
  <ng-template #dynamicContent></ng-template>
  <div [hidden]="data.component">
    {{ data.message || 'Are you sure you want to continue?' }}
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{ data.cancelText || 'Cancel' }}</button>
  <button mat-button color="primary" [mat-dialog-close]="true" cdkFocusInitial>
    {{ data.confirmText || 'Ok' }}
  </button>
</mat-dialog-actions>
