<div class="component-container">
  <h2>Child Component</h2>
  <fieldset>
    <legend></legend>
    <!-- child input field : <input type="text" [(ngModel)]="childData" appAdobeDirective fieldName="adobeChildInput"
      (input)="onInputChange($event)" />-->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Enter some information</mat-label>
      <input matInput placeholder="Enter some information" fieldName="adobeChildInput" [(ngModel)]="childData"
        appAdobeDirective (input)="onInputChange($event)" />
    </mat-form-field>
  </fieldset>
  <p class="input-value-summary"> Input field value in the child component: <span class="field-input-value">{{ childData
      }}</span></p>
  <!--<mat-divider></mat-divider>  -->
  <div class="data-passed-container">
    <p>Data passed from parent : <span class=" field-input-value">{{ name }}</span></p>
    <p>Data passed from parent using input() : <span class="field-input-value">{{ cdata() }}</span></p>
  </div>
</div>
