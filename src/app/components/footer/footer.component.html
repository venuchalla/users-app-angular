<mat-toolbar class="app-footer" role="contentinfo">
  <div class="footer-content">
    <span class="footer-copy">Users App · Angular Material examples</span>
    <span [id]="footerId">
      @if (DynamicContent$ | async; as content) {
        <span [innerHTML]="content"></span>
      }
    </span>
    <span class="footer-spacer"></span>
    <a mat-button routerLink="/">Back to home</a>
  </div>
</mat-toolbar>
